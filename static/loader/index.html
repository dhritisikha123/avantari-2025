<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avantari — Studio Dog loader</title>

<style>
/* ==================================================================
   AVANTARI — "STUDIO DOG" LOADER · 7.5s seamless loop
   Inline SVG + CSS keyframes + a little vanilla JS.
   No libraries, no webfonts, no images, no network requests.

   One person, seen from behind, working. The dog lies on the floor
   behind their chair and barks once. Sized for the middle of a page.

   ------------------------------------------------------------------
   TIMELINE  (loop = 7.5s · % = seconds / 7.5 x 100)
   ------------------------------------------------------------------
   0.00 - 2.20   0%      - 29.33%   quiet · typing, breathing, screen glow
   2.20 - 2.70   29.33%  - 36%      alert · ear twitch, eye opens, head up
   2.70 - 3.00   36%     - 40%      anticipation · pull back, chest fills
   3.00 - 3.20   40%     - 42.67%   BARK · head thrust, WOOF!, acid rings
   3.20 - 4.00   42.67%  - 53.33%   chaos · body 3.20 · phones 3.30 · chair 3.37
   4.00 - 4.70   53.33%  - 62.67%   awkward silence · they turn and stare,
                                    dog blinks once (the payoff)
   4.70 - 6.20   62.67%  - 82.67%   nothing happened · yawn, stretch, settle,
                                    phones back on, chair straightened
   6.20 - 7.50   82.67%  - 100%     reset · identical to frame 0
   ------------------------------------------------------------------
   PIVOTS: animated groups use `transform-box: fill-box`, so every
   transform-origin is measured from that group's own bounding box.
   Groups whose children also move carry an invisible `.anchor` rect
   that pins the bounding box so a pivot can never drift.
   ================================================================== */

:root{
  --loop: 7.5s;          /* single source of truth for the loop length */
  --paper: transparent;      /* off-white ground */
  --ink:   #111111;      /* characters + props */
  --acid:  #C4FF00;      /* collar, tongue, screen glow, bark accents */
}

*{ box-sizing: border-box; }
html,body{ margin:0; background: var(--paper); }
body{
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* Compact, centred, never edge to edge. aspect-ratio reserves the
   box before paint, so there is no layout shift. */
.loader{ position: relative; width: 100%; max-width: 460px; margin: 0 auto; padding: 0 16px; }
.loader svg{ display:block; width:100%; height:auto; aspect-ratio: 560 / 520; }

/* Optional sound control. Hidden until an audio file is wired up. */
.sound-toggle{
  position:absolute; left:50%; transform:translateX(-50%); bottom:-6px;
  font: 600 10px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing:.14em; text-transform:uppercase;
  padding:8px 13px; border:1.5px solid var(--ink); border-radius:999px;
  background:transparent; color:var(--ink); cursor:pointer;
}
.sound-toggle:hover{ background: var(--acid); border-color: var(--acid); }
.sound-toggle:focus-visible{ outline:3px solid var(--acid); outline-offset:2px; }
.sound-toggle[hidden]{ display:none; }

/* ---------- paint ------------------------------------------------- */
.ink{ fill: var(--ink); }
.paper-fill{ fill: var(--paper); }
.acid{ fill: var(--acid); }
/* black-on-black shapes get a paper hairline so silhouettes stay readable */
.silh{ fill: var(--ink); stroke: var(--paper); stroke-width: 3; }
.limb{ fill:none; stroke: var(--ink); stroke-width: 13; stroke-linecap: round; }
.spoke{ fill:none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; }
.hair{ fill:none; stroke: var(--ink); stroke-width: 3; }
.tail{ fill:none; stroke: var(--ink); stroke-width: 11; stroke-linecap: round; }
.band{ fill:none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; }
.ring{ fill:none; stroke: var(--acid); stroke-linecap: round; }
.mouth-line{ fill:none; stroke: var(--paper); stroke-width: 2.5; stroke-linecap: round; }
.eye-shut{ fill:none; stroke: var(--paper); stroke-width: 2.8; stroke-linecap: round; }
.ground{ fill: var(--ink); opacity:.45; }
.anchor{ fill:none; stroke:none; pointer-events:none; }  /* bbox pin, invisible */

.woof{
  font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 900; font-size: 46px; letter-spacing: -1.3px;
}

/* ---------- animation harness ------------------------------------- */
.a{
  animation-duration: var(--loop);
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  transform-box: fill-box;
}
.step{ animation-timing-function: steps(1, end); }   /* crisp on/off */

/* dog ------------------------------------------------------------- */
.anim-dog-settle{ animation-name: dogSettle; transform-origin: 50% 100%; }
.anim-dog-breath{ animation-name: dogBreath; transform-origin: 50% 100%;
                  animation-timing-function: ease-in-out; }
.anim-dog-head  { animation-name: dogHead;   transform-origin: 22px 84px; }
.anim-dog-ear   { animation-name: dogEar;    transform-origin: 50% 96%; }
.anim-dog-jaw   { animation-name: dogJaw;    transform-origin: 2px 4px; }
.anim-dog-tail  { animation-name: dogTail;   transform-origin: 100% 100%; }
.anim-eye-open  { animation-name: eyeOpen; }
.anim-eye-shut  { animation-name: eyeShut; }
#dog-eye-open{ opacity:1; }   /* base state = calm awake dog (reduced motion) */
#dog-eye-shut{ opacity:0; }

/* bark graphics --------------------------------------------------- */
.anim-woof  { animation-name: woofPop; transform-origin: 0% 100%; }
.anim-ring-1{ animation-name: ring1; transform-origin: 0% 50%; }
.anim-ring-2{ animation-name: ring2; transform-origin: 0% 50%; }
.anim-ring-3{ animation-name: ring3; transform-origin: 0% 50%; }
#bark-woof, #bark-rings > *{ opacity:0; }   /* invisible when motion is off */

/* the worker ------------------------------------------------------ */
.anim-roll  { animation-name: roll;   transform-origin: 50% 100%; } /* chair shoved back */
.anim-jolt  { animation-name: jolt; }                              /* body lurch + breath */
.anim-phones{ animation-name: phones; transform-origin: 50% 50%; }
.anim-look  { animation-name: look;   transform-origin: 57% 100%; } /* hinged at the neck */
.anim-face  { animation-name: faceGate; }                          /* profile reveal */
.anim-blink { animation-name: blink;  transform-origin: 50% 50%; }
#w-face{ opacity:0; }   /* back of the head by default */

/* desk and props ------------------------------------------------- */
.anim-wobble{ animation-name: wobble; transform-origin: 50% 100%; }
.anim-mug   { animation-name: mugTilt; transform-origin: 50% 100%; }
.anim-paper { animation-name: paperFlutter; transform-origin: 50% 100%; }
.anim-glow  { animation-name: glowPulse; transform-origin: 50% 50%;
              animation-duration: 2.5s; }   /* divides 7.5s exactly */

/* typing: a bobbing copy of the arms cross-fades with a still copy,
   so the hands can stop dead during the freeze without breaking the loop */
.arms-typing{ opacity:1; transform-box: fill-box;
              animation: gateTyping var(--loop) steps(1,end) infinite; }
.arms-still { opacity:0; transform-box: fill-box;
              animation: gateStill  var(--loop) steps(1,end) infinite; }
.arms-typing{ animation: typeBob .28s ease-in-out infinite,
                         gateTyping var(--loop) steps(1,end) infinite; }

/* pause the loop while the tab is hidden (class toggled by JS) */
.is-paused, .is-paused *{ animation-play-state: paused !important; }

/* ==================================================================
   KEYFRAMES
   ================================================================== */

/* --- dog: breathing · still when alert · chest fills on the wind up */
@keyframes dogBreath{
  0%     { transform: scaleY(1); }
  3.67%  { transform: scaleY(1.04); }
  7.33%  { transform: scaleY(1); }
  11%    { transform: scaleY(1.04); }
  14.67% { transform: scaleY(1); }
  18.33% { transform: scaleY(1.04); }
  22%    { transform: scaleY(1); }
  25.67% { transform: scaleY(1.04); }
  29.33% { transform: scaleY(1); }        /* 2.20 goes completely still */
  36%    { transform: scaleY(1); }        /* 2.70 */
  40%    { transform: scaleY(1.07); }     /* 3.00 chest full */
  41.33% { transform: scaleY(.96); }      /* 3.10 bark release */
  42.67% { transform: scaleY(1.01); }
  44%    { transform: scaleY(1); }
  62.67% { transform: scaleY(1); }        /* 4.70 frozen through the stare */
  66.67% { transform: scaleY(1.05); }     /* 5.00 yawn */
  69.33% { transform: scaleY(1); }
  82.67% { transform: scaleY(1); }        /* 6.20 asleep again, slower breath */
  87%    { transform: scaleY(1.04); }
  91.33% { transform: scaleY(1); }
  95.67% { transform: scaleY(1.04); }
  100%   { transform: scaleY(1); }
}
@keyframes calmBreath{ 0%,100%{ transform: scaleY(1); } 50%{ transform: scaleY(1.03); } }

/* --- dog: head. base art is the alert pose; asleep = curled onto the paws */
@keyframes dogHead{
  0%, 29.33% { transform: translate(0,12px) rotate(26deg) scale(1,1); }
  33.33%     { transform: translate(0,0) rotate(-3deg) scale(1,1);
               animation-timing-function: cubic-bezier(.16,.9,.3,1); }      /* 2.50 up */
  36%        { transform: translate(0,0) rotate(-3deg) scale(1,1); }        /* 2.70 still */
  40%        { transform: translate(-7px,-3px) rotate(-11deg) scale(.98,1.03);
               animation-timing-function: cubic-bezier(.45,0,.9,.45); }     /* 3.00 wind up */
  41.33%     { transform: translate(12px,2px) rotate(4deg) scale(1.08,.94); } /* 3.10 BARK */
  42.67%     { transform: translate(6px,1px) rotate(1deg) scale(1,1); }
  44.67%     { transform: translate(0,0) rotate(-3deg) scale(1,1); }
  62.67%     { transform: translate(0,0) rotate(-3deg) scale(1,1); }        /* 4.70 stare */
  65.33%     { transform: translate(0,-2px) rotate(-13deg) scale(1,1); }    /* 4.90 yawn */
  68%        { transform: translate(0,-2px) rotate(-15deg) scale(1,1); }
  70.67%     { transform: translate(0,0) rotate(-2deg) scale(1,1); }        /* 5.30 */
  80%        { transform: translate(0,1px) rotate(1deg) scale(1,1); }       /* 6.00 */
  82.67%     { transform: translate(0,15px) rotate(29deg) scale(1,1); }     /* 6.20 flops down */
  85.33%     { transform: translate(0,12px) rotate(26deg) scale(1,1); }      /* 6.40 settles */
  100%       { transform: translate(0,12px) rotate(26deg) scale(1,1); }
}

/* --- dog: the ear hears it first */
@keyframes dogEar{
  0%, 29.33% { transform: rotate(0deg); }
  30%        { transform: rotate(-18deg); }   /* 2.25 */
  30.67%     { transform: rotate(7deg); }
  31.33%     { transform: rotate(-11deg); }
  32%        { transform: rotate(2deg); }
  32.67%     { transform: rotate(0deg); }
  41.33%     { transform: rotate(0deg); }
  42%        { transform: rotate(-11deg); }   /* 3.15 bark shake */
  43.33%     { transform: rotate(4deg); }
  44.67%     { transform: rotate(0deg); }
  65.33%     { transform: rotate(0deg); }
  67.33%     { transform: rotate(-6deg); }    /* 5.05 yawn */
  70%        { transform: rotate(0deg); }
  100%       { transform: rotate(0deg); }
}

/* --- dog: jaw. cracks open on the wind up, snaps on the bark, yawns later */
@keyframes dogJaw{
  0%, 36%  { transform: rotate(0deg); }
  38.67%   { transform: rotate(9deg); }       /* 2.90 mouth starts to open */
  40%      { transform: rotate(7deg); }       /* 3.00 held a beat too long */
  41.33%   { transform: rotate(33deg);
             animation-timing-function: cubic-bezier(.1,.9,.2,1); }  /* 3.10 */
  42.67%   { transform: rotate(27deg); }
  44%      { transform: rotate(6deg); }
  45.33%   { transform: rotate(0deg); }
  62.67%   { transform: rotate(0deg); }
  65.33%   { transform: rotate(35deg); }      /* 4.90 yaaawn */
  68%      { transform: rotate(37deg); }
  70.67%   { transform: rotate(0deg); }
  100%     { transform: rotate(0deg); }
}

/* --- dog: eyes. a paper line (shut) cross-fades with a paper dot (open) */
@keyframes eyeShut{
  0%{ opacity:1; }  30%{ opacity:0; }        /* 2.25 one eye opens */
  58.5%{ opacity:1; } 60%{ opacity:0; }      /* 4.39-4.50 the innocent blink */
  66.67%{ opacity:1; } 69.5%{ opacity:0; }   /* 5.00-5.21 yawn squint */
  85.33%{ opacity:1; } 100%{ opacity:1; }    /* 6.40 back to sleep */
}
@keyframes eyeOpen{
  0%{ opacity:0; }  30%{ opacity:1; }
  58.5%{ opacity:0; } 60%{ opacity:1; }
  66.67%{ opacity:0; } 69.5%{ opacity:1; }
  85.33%{ opacity:0; } 100%{ opacity:0; }
}

/* --- dog: tail. slow sleep sway, stiff when alert, sheepish wag after */
@keyframes dogTail{
  0%     { transform: rotate(0deg); }
  7.33%  { transform: rotate(-3deg); }
  14.67% { transform: rotate(1deg); }
  22%    { transform: rotate(-2deg); }
  29.33% { transform: rotate(0deg); }
  36%    { transform: rotate(0deg); }
  41.33% { transform: rotate(-10deg); }  /* 3.10 flick */
  43.33% { transform: rotate(3deg); }
  45.33% { transform: rotate(0deg); }
  62.67% { transform: rotate(0deg); }
  64.67% { transform: rotate(-8deg); }   /* 4.85 wag */
  66%    { transform: rotate(7deg); }
  67.33% { transform: rotate(-8deg); }
  68.67% { transform: rotate(5deg); }
  70.67% { transform: rotate(0deg); }
  80%    { transform: rotate(0deg); }
  84%    { transform: rotate(-4deg); }
  88%    { transform: rotate(1deg); }
  94%    { transform: rotate(-2deg); }
  100%   { transform: rotate(0deg); }
}

/* --- dog: settles back down · a stretch and a shuffle, no rotation */
@keyframes dogSettle{
  0%, 70.67% { transform: translate(0,0) scale(1,1); }
  72.67%     { transform: translate(-4px,-2px) scale(1.015,.99);
               animation-timing-function: ease-in-out; }    /* 5.45 stretches */
  75.33%     { transform: translate(5px,1px) scale(1,1); }   /* 5.65 shuffles over */
  78.67%     { transform: translate(2px,0) scale(1,1); }
  81.33%     { transform: translate(0,0) scale(1,1); }
  100%       { transform: translate(0,0) scale(1,1); }
}

/* --- the visual bark: reads with the sound off */
@keyframes woofPop{
  0%, 39.87% { opacity:0; transform: scale(.5) rotate(-14deg); }
  40%        { opacity:1; transform: scale(1.16) rotate(-5deg); }
  41.33%     { opacity:1; transform: scale(1) rotate(-8deg); }
  44%        { opacity:1; transform: scale(1.02) rotate(-7deg); }
  44.67%     { opacity:0; transform: scale(1.06) rotate(-7deg); }
  100%       { opacity:0; transform: scale(.5) rotate(-14deg); }
}
@keyframes ring1{
  0%, 39.87%{ opacity:0; transform: scale(.35); }
  40%       { opacity:1; transform: scale(.5); }
  42.67%    { opacity:0; transform: scale(1.9); }
  100%      { opacity:0; transform: scale(.35); }
}
@keyframes ring2{
  0%, 40.53%{ opacity:0; transform: scale(.35); }
  40.67%    { opacity:1; transform: scale(.5); }
  43.33%    { opacity:0; transform: scale(1.9); }
  100%      { opacity:0; transform: scale(.35); }
}
@keyframes ring3{
  0%, 41.2% { opacity:0; transform: scale(.35); }
  41.33%    { opacity:1; transform: scale(.5); }
  44%       { opacity:0; transform: scale(1.9); }
  100%      { opacity:0; transform: scale(.35); }
}

/* --- worker: idle breath in the shoulders, then the lurch (3.20) */
@keyframes jolt{
  0%      { transform: translateY(0) scale(1,1); }
  8%      { transform: translateY(-1.6px) scale(1,1); }
  16%     { transform: translateY(0) scale(1,1); }
  24%     { transform: translateY(-1.6px) scale(1,1); }
  29.33%  { transform: translateY(0) scale(1,1); }
  42.67%  { transform: translateY(0) scale(1,1); }          /* 3.20 */
  43.6%   { transform: translateY(-9px) scale(.98,1.04); }
  44.67%  { transform: translateY(-24px) scale(1,1.05);
            animation-timing-function: cubic-bezier(.2,.8,.35,1); }  /* 3.35 up */
  46%     { transform: translateY(-21px) scale(1,1); }
  48%     { transform: translateY(-3px) scale(1,1);
            animation-timing-function: cubic-bezier(.5,0,.9,.5); }
  49.33%  { transform: translateY(3px) scale(1.04,.95); }    /* 3.70 lands hard */
  50.67%  { transform: translateY(0) scale(1,1); }
  88%     { transform: translateY(0) scale(1,1); }
  94%     { transform: translateY(-1.6px) scale(1,1); }      /* breath picks back up */
  100%    { transform: translateY(0) scale(1,1); }
}

/* --- worker: the chair is shoved backwards, towards the camera (3.37) */
@keyframes roll{
  0%, 44.93% { transform: translate(0,0) rotate(0deg) scale(1); }
  47.33%     { transform: translate(26px,9px) rotate(3deg) scale(1.035);
               animation-timing-function: cubic-bezier(.15,.85,.3,1); }  /* 3.55 */
  49.33%     { transform: translate(31px,11px) rotate(4deg) scale(1.045); }
  69.33%     { transform: translate(31px,11px) rotate(4deg) scale(1.045); } /* 5.20 held */
  78.67%     { transform: translate(-4px,-1px) rotate(-1deg) scale(.995);
               animation-timing-function: cubic-bezier(.3,.9,.3,1); }    /* 5.90 overshoot */
  81.33%     { transform: translate(1px,0) rotate(.4deg) scale(1.002); }
  82.67%     { transform: translate(0,0) rotate(0deg) scale(1); }
  100%       { transform: translate(0,0) rotate(0deg) scale(1); }
}

/* --- worker: headphones leave the head (3.30), get caught, go back on */
@keyframes phones{
  0%, 44%   { transform: translate(0,0) rotate(0deg); }
  46.67%    { transform: translate(6px,-46px) rotate(15deg);
              animation-timing-function: cubic-bezier(.2,.9,.3,1); }   /* 3.50 pop */
  50.67%    { transform: translate(9px,-42px) rotate(21deg); }
  62.67%    { transform: translate(10px,-40px) rotate(23deg); }         /* hangs there */
  65.33%    { transform: translate(5px,-9px) rotate(8deg);
              animation-timing-function: cubic-bezier(.5,0,.85,.5); }  /* 4.90 caught */
  68%       { transform: translate(3px,-5px) rotate(4deg); }
  74.67%    { transform: translate(0,-14px) rotate(1deg); }             /* 5.60 lifted back */
  77.33%    { transform: translate(0,0) rotate(0deg); }                 /* 5.80 back on */
  100%      { transform: translate(0,0) rotate(0deg); }
}

/* --- worker: idle head drift, then they turn and look down at the dog */
@keyframes look{
  0%     { transform: translate(0,0) rotate(0deg); }
  11%    { transform: translate(0,0) rotate(2deg); }
  22%    { transform: translate(0,0) rotate(-1.5deg); }
  29.33% { transform: translate(0,0) rotate(0deg); }
  44%    { transform: translate(0,0) rotate(0deg); }
  46%    { transform: translate(-7px,2px) rotate(-25deg);
           animation-timing-function: cubic-bezier(.2,.85,.3,1); }   /* 3.45 turns */
  76%    { transform: translate(-7px,2px) rotate(-25deg); }          /* 5.70 held */
  80%    { transform: translate(-2px,0) rotate(-6deg); }
  82.67% { transform: translate(0,0) rotate(0deg); }                 /* 6.20 back to work */
  100%   { transform: translate(0,0) rotate(0deg); }
}
/* the profile face only exists while the head is turned */
@keyframes faceGate{
  0%{ opacity:0; } 45.6%{ opacity:1; } 78.67%{ opacity:0; } 100%{ opacity:0; }
}
@keyframes blink{                       /* one blink inside the awkward beat */
  0%, 55%{ transform: scale(1,1); }
  56%    { transform: scale(1,.1); }
  57.2%  { transform: scale(1,1); }
  100%   { transform: scale(1,1); }
}

/* --- desk and props: exaggerated overshoot, nothing gets displaced */
@keyframes wobble{
  0%, 43.33%{ transform: rotate(0deg); }
  44.67%    { transform: rotate(-4.5deg);
              animation-timing-function: cubic-bezier(.2,.9,.3,1); }
  46.67%    { transform: rotate(3.4deg); }
  48.67%    { transform: rotate(-2deg); }
  50.67%    { transform: rotate(1.1deg); }
  52.67%    { transform: rotate(-.5deg); }
  54.67%    { transform: rotate(0deg); }
  74.67%    { transform: rotate(0deg); }
  76%       { transform: rotate(1.4deg); }   /* 5.70 straightened by hand */
  78.67%    { transform: rotate(0deg); }
  100%      { transform: rotate(0deg); }
}
@keyframes mugTilt{          /* rocks, never spills */
  0%, 43.33%{ transform: rotate(0deg); }
  45.33%    { transform: rotate(-10deg); }
  47.33%    { transform: rotate(7deg); }
  49.33%    { transform: rotate(-3.5deg); }
  51.33%    { transform: rotate(1.6deg); }
  53.33%    { transform: rotate(0deg); }
  100%      { transform: rotate(0deg); }
}
@keyframes paperFlutter{
  0%, 43.33%{ transform: translate(0,0) rotate(0deg); }
  45.33%    { transform: translate(-3px,-4px) rotate(-5deg); }
  47.33%    { transform: translate(2px,0) rotate(3deg); }
  50%       { transform: translate(-1px,-1px) rotate(-1.5deg); }
  53.33%    { transform: translate(0,0) rotate(0deg); }
  100%      { transform: translate(0,0) rotate(0deg); }
}
@keyframes glowPulse{        /* screen light spilling over the monitor's top edge */
  0%{ transform: scaleX(1); }   20%{ transform: scaleX(.6); }
  42%{ transform: scaleX(.92); } 63%{ transform: scaleX(.45); }
  85%{ transform: scaleX(.78); } 100%{ transform: scaleX(1); }
}

/* --- typing: hands bob until the bark, still until work resumes at 6.20 */
@keyframes typeBob{
  0%  { transform: translateY(0); }
  25% { transform: translateY(-2.6px); }
  50% { transform: translateY(0); }
  75% { transform: translateY(-1.5px); }
  100%{ transform: translateY(0); }
}
@keyframes gateTyping{ 0%{opacity:1;} 42.67%{opacity:0;} 82.67%{opacity:1;} 100%{opacity:1;} }
@keyframes gateStill { 0%{opacity:0;} 42.67%{opacity:1;} 82.67%{opacity:0;} 100%{opacity:0;} }

/* ==================================================================
   REDUCED MOTION — calm static scene, dog awake, only a soft breath
   ================================================================== */
@media (prefers-reduced-motion: reduce){
  .a, .arms-typing, .arms-still{ animation: none !important; }
  #dog-mass{ animation: calmBreath 6s ease-in-out infinite !important;
             transform-box: fill-box; transform-origin: 50% 100%; }
}
</style>
</head>

<body>

<div class="loader" id="loader">

  <svg viewBox="0 0 560 520" role="img" aria-labelledby="sceneTitle sceneDesc"
       preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <title id="sceneTitle">A dog barks once and startles the person working at the desk</title>
    <desc id="sceneDesc">A flat black and white illustration. Someone sits at a desk with their
      back to us, typing. A small dog with an acid-green collar sleeps on the floor behind their

  <button class="sound-toggle" id="barkSoundBtn" hidden aria-pressed="false">Enable bark sound</button>

<script>
(function () {
  'use strict';

  /* ==================================================================
     BARK AUDIO HOOK  <<<  CONNECT A REAL BARK SOUND HERE
     ------------------------------------------------------------------
     1. Drop the file beside index.html, e.g. "bark.mp3".
     2. Put its path in BARK_AUDIO_SRC below. Leave "" and the loop
        stays silent and the button stays hidden.
     3. Nothing plays until the visitor presses "Enable bark sound" —
        no autoplay, per the brief. After that it fires once per loop,
        exactly on the 3.00s bark frame.
     4. window.avantariBark() is exposed too, if you would rather
        trigger the sound from your own code or another interaction.
     ================================================================== */
  var BARK_AUDIO_SRC = '';           /* e.g. 'bark.mp3' */
  var BARK_VOLUME    = 0.6;

  /* Timing constants — keep in sync with :root{--loop} and @keyframes */
  var LOOP_MS = 7500;                /* full loop length         */
  var BARK_AT = 3000;                /* the bark frame, 3.00s in */

  var stage  = document.getElementById('loader');
  var button = document.getElementById('barkSoundBtn');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var audio     = null;
  var soundOn   = false;
  var timer     = null;
  var startedAt = 0;                 /* loop origin, in performance time */
  var pausedFor = 0;                 /* time spent with the tab hidden   */
  var hiddenAt  = 0;

  /* Anchor the loop clock on the first painted frame. */
  requestAnimationFrame(function () { startedAt = performance.now(); });

  function playBark () {
    if (!audio) return;
    try { audio.currentTime = 0; audio.play(); } catch (e) { /* ignore */ }
  }
  window.avantariBark = playBark;    /* public hook */

  function msUntilNextBark () {
    var elapsed = (performance.now() - startedAt - pausedFor) % LOOP_MS;
    var wait = BARK_AT - elapsed;
    if (wait < 0) wait += LOOP_MS;
    return wait;
  }

  function schedule () {
    clearTimeout(timer);
    if (!soundOn || document.hidden) return;
    timer = setTimeout(function () { playBark(); schedule(); }, msUntilNextBark());
  }

  /* --- sound toggle (only shown once an audio file is wired up) --- */
  if (BARK_AUDIO_SRC && !reduce.matches) {
    button.hidden = false;
    button.addEventListener('click', function () {
      soundOn = !soundOn;
      button.setAttribute('aria-pressed', String(soundOn));
      button.textContent = soundOn ? 'Mute bark sound' : 'Enable bark sound';
      if (soundOn) {
        if (!audio) { audio = new Audio(BARK_AUDIO_SRC); audio.volume = BARK_VOLUME; }
        schedule();
      } else {
        clearTimeout(timer);
      }
    });
  }

  /* --- pause the loop while the tab is hidden --------------------- */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      hiddenAt = performance.now();
      stage.classList.add('is-paused');
      clearTimeout(timer);
    } else {
      pausedFor += performance.now() - hiddenAt;
      stage.classList.remove('is-paused');
      schedule();
    }
  });
})();
</script>
